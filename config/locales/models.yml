# ActiveRecord model names, attribute labels and validation messages.
en:
  activerecord:
    models:
      activity:
        one: activity
        other: activities
      activity/category:
        one: category
        other: categories
      comment:
        one: comment
        other: comments
      mood:
        one: mood
        other: moods
      user: user
    attributes:
      user:
        email_address: Email address
        activity_duration_in_minutes: Activity duration (in minutes)
        wake_up_hour: Wake-up time
        sleep_hour: Bedtime
        locale: Language
        reminder_enabled: Enable reminders
        reminder_frequency: Frequency
        reminder_hour: Time
      activity:
        started_at: Start time
      activity/category:
        label: Label
        color: Color
      comment:
        body: Note
        date: Date
      mood:
        level: Mood
        date: Date
    errors:
      models:
        activity:
          attributes:
            base:
              already_exists: An activity already exists for this time slot.
            started_at:
              future: can't be in the future.
        activity/category:
          attributes:
            base:
              protected: This category is protected and cannot be modified.
